name: Pull Request tests
on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  protocol-harness-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: "Run fake NBD harness self-test"
        run: python3 tests/nbd_protocol_harness/fake_nbd_server.py --self-test

  static-analysis:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64
      # stampinf.exe can be unavailable unless the toolkit bin directory is on PATH.
      - name: "Add toolkit bin dir to env PATH"
        run: >
          Add-Content $env:GITHUB_PATH
          "C:\Program Files (x86)\Windows Kits\10\bin\x64"
      - name: "Show git log"
        run: git log -n 10 --oneline
      # SDV remains scheduled/non-blocking in scheduled-driver-verification.yaml.
      - name: "Run static analysis tests"
        run: >
          msbuild vstudio\wnbd.sln
          /property:Configuration=Analyze
          /property:RunSDV=False

  build-and-test:
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64
      # stampinf.exe can be unavailable unless the toolkit bin directory is on PATH.
      - name: "Add toolkit bin dir to env PATH"
        run: >
          Add-Content $env:GITHUB_PATH
          "C:\Program Files (x86)\Windows Kits\10\bin\x64"
      - name: "Show git log"
        run: git log -n 10 --oneline
      - name: "Build WNBD"
        run: >
          msbuild vstudio\wnbd.sln
          /property:Configuration=${{ matrix.configuration }}
      - name: "Add WNBD build directory to env PATH"
        run: >
          Add-Content $env:GITHUB_PATH
          (Resolve-Path vstudio\x64\${{ matrix.configuration }}).Path
      - name: "Run WNBD unit tests"
        run: |
          New-Item -ItemType Directory -Force -Path ci-artifacts | Out-Null
          libwnbd_unit_tests.exe --gtest_output=xml:ci-artifacts\libwnbd-unit-tests-${{ matrix.configuration }}.xml
      - name: "Write unit test summary"
        if: always()
        run: >
          powershell -ExecutionPolicy Bypass -File tests\ci\write-test-summary.ps1
          -XmlPath ci-artifacts\libwnbd-unit-tests-${{ matrix.configuration }}.xml
          -Title "WNBD ${{ matrix.configuration }} unit test summary"
      - name: "Import WNBD certificate to root store"
        run: >
          Import-Certificate
          -FilePath vstudio\x64\${{ matrix.configuration }}\wnbd.cer
          -Cert Cert:\LocalMachine\Root
      - name: "Import WNBD certificate to trusted publisher store"
        run: >
          Import-Certificate
          -FilePath vstudio\x64\${{ matrix.configuration }}\wnbd.cer
          -Cert Cert:\LocalMachine\TrustedPublisher
      - name: "Import WNBD event definitions"
        run: wevtutil im vstudio\wnbdevents.xml
      - name: "Install the WNBD driver and create the virtual adapter"
        timeout-minutes: 1
        run: >
          wnbd-client install-driver --debug
          vstudio\x64\${{ matrix.configuration }}\driver\wnbd.inf
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: "Run fake NBD DISC assertion test"
        run: >
          powershell -ExecutionPolicy Bypass -File tests\ci\run-fake-nbd-test.ps1
          -TestExecutable libwnbd_tests.exe
          -Scenario assert-disc
          -Port 10810
          -OutputDir ci-artifacts
      - name: "Run fake NBD FLUSH assertion test"
        run: >
          powershell -ExecutionPolicy Bypass -File tests\ci\run-fake-nbd-test.ps1
          -TestExecutable libwnbd_tests.exe
          -Scenario assert-flush-zero
          -GTestFilter TestNbd.TestFlush
          -Port 10811
          -OutputDir ci-artifacts
      - name: "Run fake NBD full I/O test"
        run: >
          powershell -ExecutionPolicy Bypass -File tests\ci\run-fake-nbd-test.ps1
          -TestExecutable libwnbd_tests.exe
          -Scenario record
          -GTestFilter TestNbd.TestIO
          -Port 10812
          -OutputDir ci-artifacts
      - name: "Run fake NBD malformed negotiation tests"
        run: |
          $scenarios = @(
            @{ Name = "ack-without-export"; Port = 10818 },
            @{ Name = "truncated-info"; Port = 10819 }
          )
          foreach ($scenario in $scenarios) {
            powershell -ExecutionPolicy Bypass -File tests\ci\run-fake-nbd-test.ps1 `
              -TestExecutable libwnbd_tests.exe `
              -Scenario $scenario.Name `
              -GTestFilter TestNbdHandshakeFailures.NegotiationFailureReturnsError `
              -Port $scenario.Port `
              -OutputDir ci-artifacts
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
      - name: "Run fake NBD disconnect/error race tests"
        run: |
          $scenarios = @(
            @{ Name = "close-after-write-read"; Filter = "TestNbdFailures.ReadFailureAfterWriteCompletes"; Port = 10813 },
            @{ Name = "truncate-after-write-read"; Filter = "TestNbdFailures.ReadFailureAfterWriteCompletes"; Port = 10814 },
            @{ Name = "error-after-write-read"; Filter = "TestNbdFailures.ReadFailureAfterWriteCompletes"; Port = 10815 },
            @{ Name = "unexpected-handle-after-write-read"; Filter = "TestNbdFailures.ReadFailureAfterWriteCompletes"; Port = 10816 },
            @{ Name = "stall-after-write-read"; Filter = "TestNbdFailures.RemovalWhileReadIsStalledCompletes"; Port = 10817 }
          )
          foreach ($scenario in $scenarios) {
            powershell -ExecutionPolicy Bypass -File tests\ci\run-fake-nbd-test.ps1 `
              -TestExecutable libwnbd_tests.exe `
              -Scenario $scenario.Name `
              -GTestFilter $scenario.Filter `
              -Port $scenario.Port `
              -OutputDir ci-artifacts
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
      - name: "Install qemu, used for NBD tests"
        # community.chocolatey.org intermittently returns 504s; retry so a
        # transient feed error does not fail the whole job.
        run: |
          $attempts = 3
          for ($i = 1; $i -le $attempts; $i++) {
            choco install qemu --version 2023.4.24 -y --no-progress
            if ($LASTEXITCODE -eq 0) { break }
            Write-Host "choco install qemu failed (attempt $i/$attempts, exit code $LASTEXITCODE)."
            if ($i -eq $attempts) { throw "Failed to install qemu after $attempts attempt(s)." }
            Start-Sleep -Seconds 15
          }
      - name: "Add qemu directory to env PATH"
        run: Add-Content $env:GITHUB_PATH 'C:\Program Files\qemu'
      - name: "Create qcow2 image, used for NBD"
        run: qemu-img create -f qcow2 test_5tb.qcow2 5T
      # cache.direct=on doesn't work with qcow2 images. Sparse files may not
      # be properly handled on Windows, so we'll avoid raw images for now.
      - name: "Start qemu-storage-daemon NBD server and wait until ready"
        run: >
          powershell -ExecutionPolicy Bypass -File tests\ci\start-qemu-nbd.ps1
          -ImagePath test_5tb.qcow2
          -HostName 127.0.0.1
          -Port 10809
          -ExportName test_5tb
          -OutputDir ci-artifacts
          -TimeoutSeconds 30
      - name: "Run WNBD functional tests"
        # TestNbdHandshakeFailures.* and TestNbdFailures.* are driven separately
        # against the fake NBD server, which injects the malformed handshake /
        # read failure / stall they assert on. Against the real qemu server the
        # handshake succeeds, so WnbdRunNbdDaemon blocks serving the disk and the
        # test hangs; exclude those suites here. TestNbdSoak.* is a long,
        # multi-threaded soak driven as its own step below.
        timeout-minutes: 5
        run: >
          libwnbd_tests.exe
          --gtest_filter=-TestNbdHandshakeFailures.*:TestNbdFailures.*:TestNbdSoak.*
          --gtest_output=xml:ci-artifacts\libwnbd-tests-${{ matrix.configuration }}.xml
          --nbd-export-name test_5tb
          --nbd-hostname 127.0.0.1
          --nbd-port 10809
      - name: "Run WNBD concurrency soak test"
        # Sustained multi-threaded overlapping I/O exercises the hot-path
        # concurrency changes. WNBD_DISPATCHER_THREADS>1 makes the daemon issue
        # genuinely concurrent outbound sends, which is what actually exercises
        # SendLock (with a single dispatcher, sends never overlap). Time-bounded
        # here for the PR gate; a nightly build can raise the knobs.
        timeout-minutes: 6
        env:
          WNBD_SOAK_SECONDS: 25
          WNBD_SOAK_THREADS: 32
          WNBD_DISPATCHER_THREADS: 4
        run: >
          libwnbd_tests.exe
          --gtest_filter=TestNbdSoak.*
          --gtest_output=xml:ci-artifacts\libwnbd-soak-${{ matrix.configuration }}.xml
          --nbd-export-name test_5tb
          --nbd-hostname 127.0.0.1
          --nbd-port 10809
      - name: "Collect diagnostics"
        if: always()
        run: powershell -ExecutionPolicy Bypass -File tests\ci\collect-diagnostics.ps1 -OutputDir ci-artifacts
      - name: "Stop qemu"
        if: always()
        run: powershell -ExecutionPolicy Bypass -File tests\ci\stop-qemu.ps1
      - name: "Upload diagnostics"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wnbd-${{ matrix.configuration }}-diagnostics
          path: ci-artifacts
          if-no-files-found: ignore
      - name: "Write workflow summary"
        if: always()
        run: >
          powershell -ExecutionPolicy Bypass -File tests\ci\write-test-summary.ps1
          -XmlPath ci-artifacts\libwnbd-tests-${{ matrix.configuration }}.xml
          -Title "WNBD ${{ matrix.configuration }} test summary"
